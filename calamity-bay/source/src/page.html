<title>Calamity Bay</title>
<meta name="description" content="Pick a giant monster, rise from the bay or burst out of the mountain, and level a city.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f4ecdc; --dim: #b9ad98; --hz: #ffd23a; --red: #e8402c; --panel: rgba(14,12,10,.62); --line: rgba(255,236,200,.18); --accent: #4fd8ff; }
  html, body { margin: 0; height: 100%; background: #1a1612; overflow: hidden; color: var(--ink);
    font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; }
  [hidden] { display: none !important; }
  #app { position: fixed; inset: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bebas { font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-weight: 400; letter-spacing: .04em; }

  /* HUD */
  #hud { position: absolute; inset: 0; pointer-events: none; display: none; }
  body[data-state="play"] #hud, body[data-state="intro"] #hud { display: block; }
  body[data-state="intro"] #hud .gauges { opacity: 0; }
  .gauges { transition: opacity .6s; }
  #left { position: absolute; left: 18px; top: 14px; width: min(320px, 42vw); }
  #mname { font-size: 34px; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.6); color: var(--accent); }
  .bar { position: relative; height: 12px; background: rgba(0,0,0,.55); border: 1px solid var(--line); margin-top: 6px; border-radius: 2px; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transition: width .15s; }
  #hp i { background: linear-gradient(90deg, #c8321f, #ff6a3a); }
  #hp.low i { animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { filter: brightness(1.8); } }
  #rage i { background: linear-gradient(90deg, #2b7da0, var(--accent)); }
  #rage.full i { background: linear-gradient(90deg, var(--accent), #fff); animation: pulse .35s infinite alternate; }
  .lbl { font-size: 14px; font-weight: 700; letter-spacing: .14em; color: var(--dim); margin-top: 6px; display: flex; justify-content: space-between; text-shadow: 0 1px 0 #000; }
  #ready { color: var(--accent); }
  #homeTag { color: #9effa8; }
  #right { position: absolute; right: 18px; top: 14px; text-align: right; width: min(300px, 44vw); }
  #pct { font-size: 52px; line-height: .9; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  #pct small { font-size: 22px; color: var(--dim); margin-left: 4px; }
  #dbar { height: 8px; }
  #dbar i { background: linear-gradient(90deg, #ffb02a, var(--hz)); }
  #dbar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; }
  #threat { font-size: 15px; font-weight: 700; letter-spacing: .14em; margin-top: 8px; color: var(--dim); text-shadow: 0 1px 0 #000; }
  #threat span { color: var(--red); letter-spacing: .05em; font-size: 18px; }
  #threat em { font-style: normal; color: rgba(255,236,200,.35); }
  #money { font-size: 20px; font-weight: 700; color: var(--hz); text-shadow: 0 1px 0 #000; margin-top: 2px; }
  #cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; opacity: .7; }
  #cross:before, #cross:after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  #cross:before { left: 10px; top: 0; width: 2px; height: 7px; box-shadow: 0 15px 0 #fff, 0 0 2px #000; }
  #cross:after { top: 10px; left: 0; height: 2px; width: 7px; box-shadow: 15px 0 0 #fff, 0 0 2px #000; }
  body[data-state="intro"] #cross { display: none; }
  #banner { position: absolute; left: 0; right: 0; top: 19%; text-align: center; font-size: clamp(34px, 6vw, 72px); color: var(--ink);
    text-shadow: 0 3px 0 rgba(0,0,0,.55), 0 0 30px rgba(0,0,0,.5); opacity: 0; transform: scale(1.08); transition: opacity .35s, transform .35s; }
  #banner.on { opacity: 1; transform: none; }
  #banner.mil { color: var(--hz); font-size: clamp(26px, 4vw, 44px); top: 15%; }
  #banner.sp { color: var(--accent); }
  #hint { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 19px; font-weight: 600; color: var(--ink); text-shadow: 0 1px 2px #000; opacity: 0; transition: opacity .6s; }
  #hint.on { opacity: .92; }
  #keys { position: absolute; left: 18px; bottom: 16px; font-size: 15px; line-height: 1.45; color: var(--dim); text-shadow: 0 1px 1px #000; opacity: .85; transition: opacity 1s; }
  #keys b { color: var(--ink); font-weight: 700; }
  #skip { position: absolute; right: 20px; bottom: 18px; font-size: 16px; letter-spacing: .12em; color: var(--dim); display: none; }
  body[data-state="intro"] #skip { display: block; }
  #fps { position: absolute; right: 8px; bottom: 4px; font: 12px monospace; color: #fff; opacity: .6; }

  /* Screens */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; }
  #title { background: linear-gradient(180deg, rgba(10,8,6,.15), rgba(10,8,6,.55) 55%, rgba(10,8,6,.85)); overflow-y: auto; justify-content: flex-start; padding-top: max(4vh, 16px); }
  #logo { font-size: clamp(56px, 11vw, 140px); line-height: .85; margin: 0; color: var(--ink);
    text-shadow: 0 4px 0 #7a1d12, 0 8px 30px rgba(0,0,0,.6); }
  #logo em { font-style: normal; color: var(--hz); }
  .tag { font-size: clamp(16px, 2.2vw, 22px); color: var(--ink); text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 18px rgba(0,0,0,.5); letter-spacing: .2em; margin: 8px 0 22px; text-transform: uppercase; }
  #cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 980px; }
  .card { width: min(440px, 92vw); text-align: left; padding: 16px 18px 14px; background: var(--panel); border: 2px solid var(--line); border-radius: 6px; cursor: pointer;
    box-sizing: border-box; transition: border-color .15s, transform .15s, background .15s; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .card:hover { transform: translateY(-2px); }
  .card.sel { border-color: var(--c); background: rgba(14,12,10,.8); box-shadow: 0 0 0 1px var(--c), 0 10px 40px rgba(0,0,0,.4); }
  .card h2 { margin: 0; font-size: 44px; line-height: 1; color: var(--c); }
  .card .origin { font-size: 15px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); opacity: .85; }
  .card p { margin: 8px 0 10px; font-size: 17px; line-height: 1.3; color: var(--dim); }
  .stat { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--dim); margin: 3px 0; }
  .stat div { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
  .stat div i { display: block; height: 100%; background: var(--c); }
  .moves { margin-top: 10px; font-size: 15px; color: var(--ink); line-height: 1.5; }
  .moves span { color: var(--dim); }
  button.big { font-family: 'Bebas Neue', Impact, sans-serif; font-size: clamp(30px, 4vw, 42px); letter-spacing: .08em; color: #1a1210; background: var(--hz); border: 0; border-radius: 4px;
    padding: 8px 40px 4px; margin-top: 22px; cursor: pointer; box-shadow: 0 4px 0 #9a6c00, 0 10px 30px rgba(0,0,0,.4); }
  button.big:hover, button.big:focus-visible { filter: brightness(1.1); outline: none; }
  button.big:active { transform: translateY(2px); box-shadow: 0 2px 0 #9a6c00; }
  button.ghost { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: none; border: 1px solid var(--line); }
  .help { margin-top: 18px; font-size: 16px; color: var(--dim); line-height: 1.5; max-width: 760px; }
  .help b { color: var(--ink); }
  #best { margin-top: 8px; font-size: 15px; color: var(--hz); letter-spacing: .1em; }
  #pause { background: rgba(10,8,6,.6); }
  #pause h2 { font-size: 70px; margin: 0; }
  #pause p { color: var(--dim); font-size: 18px; letter-spacing: .1em; }
  #end { background: rgba(10,8,6,.72); overflow-y: auto; justify-content: safe center; }
  #end h2 { font-size: clamp(44px, 8vw, 96px); margin: 0; line-height: .9; color: var(--hz); text-shadow: 0 4px 0 #7a1d12; }
  #end.lose h2 { color: var(--ink); text-shadow: 0 4px 0 #222; }
  #endSub { font-size: 20px; color: var(--dim); margin: 10px 0 18px; letter-spacing: .06em; max-width: 640px; }
  #grade { font-size: 110px; line-height: .9; color: var(--hz); }
  #stats { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 10px 26px; margin: 12px 0 4px; }
  #stats div { font-size: 14px; letter-spacing: .14em; color: var(--dim); font-weight: 700; }
  #stats b { display: block; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: 34px; letter-spacing: .04em; color: var(--ink); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.2s; }

  /* Touch */
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
  body.touch[data-state="play"] #touch { display: block; }
  body.touch #keys, body.touch #cross { display: none; }
  #joy { position: absolute; width: 120px; height: 120px; margin: -60px; border: 2px solid rgba(255,255,255,.25); border-radius: 50%; display: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: rgba(255,255,255,.25); }
  #touch button { pointer-events: auto; position: absolute; font-family: 'Bebas Neue', Impact, sans-serif; font-size: 18px; letter-spacing: .06em; color: var(--ink);
    background: rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.3); width: 70px; height: 70px; border-radius: 50%; }
  #tAtk { right: 24px; bottom: 30px; width: 92px !important; height: 92px !important; font-size: 24px !important; border-color: var(--hz) !important; }
  #tHvy { right: 128px; bottom: 22px; }
  #tGrab { right: 30px; bottom: 134px; }
  #tSp { right: 112px; bottom: 112px; border-color: var(--accent) !important; }
  #tRoar { right: 206px; bottom: 22px; }
  #tRun { left: 24px; bottom: 150px; width: 60px !important; height: 60px !important; }
  #tRun.on { background: rgba(255,210,58,.35); }
  #tPause { right: 16px; top: 150px; width: 48px !important; height: 48px !important; font-size: 14px !important; }
  @media (max-height: 520px) {
    #end h2 { font-size: 40px; } #grade { font-size: 56px; } #endSub { font-size: 15px; margin: 4px 0 6px; }
    #stats b { font-size: 24px; } #stats { gap: 4px 18px; } button.big { font-size: 26px; margin-top: 10px; }
    #logo { font-size: 52px; } .tag { margin: 4px 0 10px; } .card p { display: none; }
  }
  @media (max-width: 640px) {
    #mname { font-size: 26px; } #pct { font-size: 38px; } #money, #threat { font-size: 14px; }
    .card h2 { font-size: 34px; } .card p { font-size: 15px; } #stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="gauges">
      <div id="left">
        <div id="mname" class="bebas">TIDEMAW</div>
        <div class="bar" id="hp"><i></i></div>
        <div class="bar" id="rage"><i></i></div>
        <div class="lbl"><span>RAGE</span><span id="ready"></span></div>
        <div class="lbl"><span id="homeTag"></span></div>
      </div>
      <div id="right">
        <div id="pct" class="bebas">0%<small>DESTROYED</small></div>
        <div class="bar" id="dbar"><i></i><b></b></div>
        <div id="threat">THREAT <span>☆☆☆☆☆</span></div>
        <div id="money">$0 IN DAMAGE</div>
      </div>
      <div id="keys"></div>
    </div>
    <div id="cross"></div>
    <div id="banner" class="bebas"></div>
    <div id="hint"></div>
    <div id="skip">CLICK OR PRESS SPACE TO SKIP</div>
    <div id="fps" hidden></div>
  </div>
  <div id="touch"><div id="joy"><i></i></div>
    <button id="tAtk">SMASH</button><button id="tHvy">HEAVY</button><button id="tGrab">GRAB</button>
    <button id="tSp">SPECIAL</button><button id="tRoar">ROAR</button><button id="tRun">RUN</button><button id="tPause">II</button>
  </div>
  <div id="title" class="screen">
    <h1 id="logo" class="bebas">CALAMITY <em>BAY</em></h1>
    <div class="tag">Two million people. One very bad afternoon.</div>
    <div id="cards"></div>
    <button id="start" class="big">UNLEASH</button>
    <div class="help" id="help"></div>
    <div id="best"></div>
  </div>
  <div id="pause" class="screen" hidden><h2 class="bebas">PAUSED</h2><p>CLICK TO RESUME · M TO MUTE</p></div>
  <div id="end" class="screen" hidden>
    <h2 id="endTitle" class="bebas"></h2>
    <div id="endSub"></div>
    <div id="grade" class="bebas"></div>
    <div id="stats"></div>
    <div class="row"><button id="cont" class="big">KEEP SMASHING</button><button id="again" class="big ghost">NEW RAMPAGE</button></div>
  </div>
  <div id="fade"></div>
</div>
